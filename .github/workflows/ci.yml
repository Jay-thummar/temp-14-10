name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps (workspaces)
        run: npm install --ignore-scripts

      - name: Lint
        run: npm run lint --workspaces || true

      - name: Test
        run: npm test --workspaces || true

      - name: Build
        run: npm run build --workspaces

